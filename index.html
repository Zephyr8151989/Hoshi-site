<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoshi</title>

    <style>
       

* {
    box-sizing: border-box;
}

body {
    background-image:
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
        url("fond.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    font-family: 'Gill Sans', 'Gill Sans MT',
                 Calibri, 'Trebuchet MS', sans-serif;

    margin: 0;
    padding: 50px 20px 30px;
    text-align: center;
    min-height: 100vh;
    color: white;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;

    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;

    width: 100%;
    margin: 0 auto;
    padding: 35px 20px;
}

h1 {
    color: white;
    margin: 0;
    font-size: clamp(28px, 5vw, 42px);
    letter-spacing: 2px;
    text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
}

.logo {
    height: 300px;
    max-width: 90%;
    object-fit: contain;
    
}

#ENTER {
    background: #8b35d6;
    color: white;
    padding: 14px 55px;
    
    cursor: pointer;
    text-transform: uppercase;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 5px 20px rgba(139, 53, 214, 0.4);
    transition: transform 0.2s, background 0.2s;
}

#ENTER:hover {
    background: #a653ed;
    transform: translateY(-3px);
}

ul {
    list-style: none;
    padding: 0;
    margin: 10px 0 0;
}

li {
    display: inline-block;
    margin: 8px 12px;
}

a.social {
    color: white;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid #bb86fc;
    padding-bottom: 4px;
    transition: color 0.2s;
}

a.social:hover {
    color: #d8b5ff;
}

@media (max-width: 600px) {
    body {
        padding: 30px 15px;
        background-attachment: scroll;
    }

    .container {
        padding: 28px 15px;
        gap: 20px;
    }

    .logo {
        height: 230px;
    }
}

    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to Hoshi World</h1>

        <img
            class="logo"
            src="https://cdn.phototourl.com/member/2026-10-21-8265edf2-0fc9-4b5c-95b3-ef47cf159f09.png"
            alt="Logo Hoshi"
        >

        <button id="ENTER" onclick="window.location.href='home.html'">ENTER</button>

        <ul>
            <li>
                <a class="social" href="https://www.instagram.com/hoshi.fbtw">
                    Instagram
                </a>
            </li>
            <li>
                <a class="social" href="https://www.tiktok.com/@hoshi.fbtw">
                    TikTok
                </a>
            </li>
        </ul>
    </div>
</body>
</html></html>
